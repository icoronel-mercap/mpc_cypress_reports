<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Métricas - Cypress</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 20px; color: #333; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; background: #f1f3f5; padding: 15px; border-radius: 6px;}
        select, input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;}
        .btn-group { margin-left: auto; display: flex; gap: 10px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; }
        button.ocultar { background-color: #ffe3e3; color: #c92a2a; border: 1px solid #ffc9c9; }
        button.ocultar:hover { background-color: #ffc9c9; }
        button.mostrar { background-color: #e3fafc; color: #0b7285; border: 1px solid #c5f6fa; }
        button.mostrar:hover { background-color: #c5f6fa; }
        .chart-container { position: relative; height: 60vh; width: 100%; }
        h1, h2 { color: #2c3e50; margin-top: 0; }
    </style>
</head>
<body>
    <h1>Reportes de Performance MPC</h1>
    
    <div class="card">
        <h2>Reporte Histórico</h2>
        <div class="controls">
            <label>Ambiente: <select id="envSelect"></select></label>
            <label>Cliente: <select id="clientSelect"></select></label>
            <div class="btn-group">
                <button class="ocultar" onclick="toggleLineas(chart1, false)">Ocultar Todas</button>
                <button class="mostrar" onclick="toggleLineas(chart1, true)">Mostrar Todas</button>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="chartHistorico"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>Reporte Evolución Mensual</h2>
        <div class="controls">
            <label>Seleccionar Mes: <input type="month" id="monthSelect"></label>
            <label>Ambiente: <select id="envSelectMes"></select></label>
            <label>Cliente: <select id="clientSelectMes"></select></label>
            <div class="btn-group">
                <button class="ocultar" onclick="toggleLineas(chart2, false)">Ocultar Todas</button>
                <button class="mostrar" onclick="toggleLineas(chart2, true)">Mostrar Todas</button>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="chartMensual"></canvas>
        </div>
    </div>
</body>
</html>
